services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rumigpt:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_CA_CERT_PATH: /run/secrets/aiven_ca
    expose:
      - "3000"
    secrets:
      - aiven_ca
    volumes:
      - uploads:/app/public/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  aiven_ca:
    file: ./aiven-ca.pem

volumes:
  uploads:
  caddy_data:
  caddy_config:
